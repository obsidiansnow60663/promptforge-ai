{% extends 'core/base.html' %}{% block content %}<a href="{% url 'history' %}" class="text-sm text-indigo-400">← Riwayat</a><h1 class="mt-4 text-3xl font-semibold">Detail prompt</h1><div class="mt-6 space-y-5">{% include 'core/result.html' %}<section class="rounded-xl border border-slate-800 bg-slate-900 p-6"><h2 class="font-semibold">Instruksi awal</h2><pre class="mt-3 text-sm text-slate-300">{{ prompt.original }}</pre><details class="mt-5 text-sm"><summary>Analisis dan tinjauan</summary><pre class="mt-3 text-slate-400">{{ prompt.analysis }}</pre><pre class="mt-3 text-slate-400">{{ prompt.review }}</pre></details></section><section class="rounded-xl border border-slate-800 bg-slate-900 p-6"><h2 class="font-semibold">Berikan masukan</h2><form action="{% url 'feedback' prompt.pk %}" method="post" class="mt-4 space-y-3">{% csrf_token %}<label for="rating">Nilai 1–5</label><select id="rating" name="rating">{% for n in '12345' %}<option value="{{ n }}">{{ n }}</option>{% endfor %}</select><label for="comment">Komentar (opsional)</label><textarea id="comment" name="comment" maxlength="2000" rows="3"></textarea><button class="rounded-lg bg-indigo-500 px-4 py-2 text-sm">Kirim masukan</button></form></section></div>{% endblock %}
